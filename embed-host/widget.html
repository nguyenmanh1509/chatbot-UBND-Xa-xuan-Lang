<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot Xuân Lãng</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

    .chat-launcher {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, #0f3a8a 0%, #1e54c7 100%);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.35), 0 0 0 4px rgba(255, 255, 255, 0.85);
        z-index: 999999;
        transition: transform .2s, box-shadow .2s;
    }
    .chat-launcher:hover {
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.4), 0 0 0 4px rgba(255, 255, 255, 0.9);
    }
    .chat-launcher:active {
        transform: translateY(0) scale(.97);
    }

    .chat-panel {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 420px;
        height: 640px;
        max-width: calc(100vw - 20px);
        max-height: calc(100vh - 110px);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(0, 0, 0, 0.05);
        z-index: 999999;
        display: none;
    }
    .chat-panel.open {
        display: block;
        animation: panelIn .25s cubic-bezier(.2, .9, .3, 1.2);
    }
    .chat-panel iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }
    .chat-close {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
        transition: background .15s;
    }
    .chat-close:hover { background: rgba(255, 255, 255, 0.25); }

    @keyframes panelIn {
        from { transform: scale(.85) translateY(20px); opacity: 0; }
        to   { transform: scale(1) translateY(0); opacity: 1; }
    }

    @media (max-width: 520px) {
        .chat-launcher { right: 16px; bottom: 16px; width: 56px; height: 56px; }
        .chat-panel {
            width: calc(100vw - 20px);
            height: calc(100vh - 110px);
            right: 10px;
            bottom: 84px;
            border-radius: 14px;
        }
        .chat-panel iframe { border-radius: 14px; }
    }
</style>
</head>
<body>
    <button class="chat-launcher" id="launcher" aria-label="Mở chatbot">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
    </button>

    <div class="chat-panel" id="panel">
        <button class="chat-close" id="closeBtn" aria-label="Đóng">×</button>
        <iframe
          src="https://nguyenmanh1509.github.io/chatbot-UBND-Xa-xuan-Lang/index.html?v=2026"
          title="Chatbot UBND Xã Xuân Lãng"
          allow="clipboard-write">
        </iframe>
    </div>

    <script>
    (function () {
        var launcher = document.getElementById('launcher');
        var panel = document.getElementById('panel');
        var closeBtn = document.getElementById('closeBtn');

        launcher.addEventListener('click', function () {
            panel.classList.add('open');
        });

        closeBtn.addEventListener('click', function () {
            panel.classList.remove('open');
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && panel.classList.contains('open')) {
                panel.classList.remove('open');
            }
        });
    })();
    </script>
</body>
</html>
