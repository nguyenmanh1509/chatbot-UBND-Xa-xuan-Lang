name = "ubnd-xuanlang-bot"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Load file .html dưới dạng text module
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
# Admin đăng nhập bằng Authorization: Bearer <mật khẩu>
# KHÔNG đặt ở đây (vars sẽ ghi đè secret).
# Đặt bằng:  wrangler secret put ADMIN_PASSWORD
SITE_NAME = "Trợ lý tra cứu thủ tục hành chính UBND xã Xuân Lãng"

[observability]
enabled = true

# --- Workers AI binding ---
# Gọi AI trực tiếp từ Worker, MIỄN PHÍ trên gói Free, KHÔNG cần API token.
# Bật AI: provider = "workers-ai" trong Admin panel.
[ai]
binding = "AI"

# Cron: đồng bộ thủ tục của xã từ Cổng DVC 2 lần/ngày (03:00 và 15:00 giờ VN)
# + làm mới access token Zalo OA.
# Cloudflare Free cho phép cron -> vẫn miễn phí, dữ liệu luôn mới nhất.
[triggers]
crons = ["0 20 * * *", "0 8 * * *"]

# --- KV namespace thật (đã tạo trên Cloudflare) ---
[[kv_namespaces]]
binding = "CONFIG"
id = "f4e0ec9ef1144ac69e9bd7064ea760db"

[[kv_namespaces]]
binding = "LOGS"
id = "c0537ffcf3fb4499bdcf16e3785608c2"

# --- D1: thủ tục riêng của xã + tài khoản admin ---
[[d1_databases]]
binding = "DB"
database_name = "ubnd_xuanlang_procs"
database_id = "0b80ae18-4dce-461a-9a87-253432c92d64"

# --- Gán KV cho phát triển cục bộ ---
# Wrangler dev dùng id ở trên; nếu muốn tách riêng cho local thì bỏ comment
# các khối trên và dùng id local.


