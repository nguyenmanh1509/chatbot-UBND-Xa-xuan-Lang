<!--
    Nhúng Chatbot UBND Xã Xuân Lãng vào Joomla / bất kỳ trang nào
    Đặt ngay trước thẻ </body> trong template
-->
<div id="xuanlang-chatbot-host"
     style="position:fixed; bottom:0; right:0; width:0; height:0; z-index:999999;"></div>

<iframe
    id="xuanlang-chatbot"
    src="https://nguyenmanh1509.github.io/chatbot-UBND-Xa-xuan-Lang/index.html?v=2026&t=now"
    title="Chatbot UBND Xã Xuân Lãng"
    allow="clipboard-write"
    style="
        position:fixed;
        bottom:50px;
        right:20px;
        width:60px;
        height:60px;
        border:none;
        background:transparent;
        z-index:999999;
        transition:width .2s ease, height .2s ease, bottom .2s ease;
    "
></iframe>

<script>
(function () {
    const iframe = document.getElementById('xuanlang-chatbot');

    // Đợi iframe load xong (hoặc khi nào postMessage được gửi)
    window.addEventListener('message', function (event) {
        if (
            event.origin !== 'https://nguyenmanh1509.github.io' ||
            !event.data ||
            event.data.type !== 'xuanlang-chat-resize'
        ) {
            return;
        }

        if (event.data.open) {
            // Mở: phình ra panel chat
            iframe.style.width = '440px';
            iframe.style.height = '640px';
            iframe.style.maxWidth = 'calc(100vw - 24px)';
            iframe.style.maxHeight = 'calc(100vh - 24px)';
            iframe.style.bottom = '12px';
        } else {
            // Đóng: thu về 60×60, icon lên cao một chút
            iframe.style.width = '60px';
            iframe.style.height = '60px';
            iframe.style.maxWidth = '60px';
            iframe.style.maxHeight = '60px';
            iframe.style.bottom = '50px';
        }
    });
})();
</script>
