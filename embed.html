<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot Xuân Lãng</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .cw-host {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 420px;
        height: 640px;
        max-width: calc(100vw - 20px);
        max-height: calc(100vh - 110px);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.05);
        background: linear-gradient(135deg, #0B3D62 0%, #1e54c7 100%);
        z-index: 999999;
        transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    .cw-host:hover { transform: translateY(-4px); }
    .cw-host iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: transparent;
    }
    .cw-label {
        position: absolute;
        top: -30px;
        right: 0;
        background: linear-gradient(135deg, #0B3D62, #1e54c7);
        color: #fff;
        padding: 6px 16px;
        border-radius: 20px 20px 0 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.3px;
        box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
        user-select: none;
        pointer-events: none;
    }
    @media (max-width: 520px) {
        .cw-host {
            width: calc(100vw - 20px);
            height: calc(100vh - 110px);
            right: 10px;
            bottom: 90px;
            border-radius: 14px;
        }
        .cw-label { display: none; }
    }
</style>
</head>
<body>
    <div class="cw-host">
        <div class="cw-label">💬 Hỗ trợ tra cứu</div>
        <iframe
          src="index.html"
          allow="clipboard-write"
          title="Chatbot UBND Xã Xuân Lãng"
          loading="lazy">
        </iframe>
    </div>
</body>
</html>
